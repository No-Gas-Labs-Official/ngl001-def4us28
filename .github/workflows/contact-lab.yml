name: CONTACT laboratory validation
on:
  workflow_dispatch:
  push:
    branches: [contact/three-plane-evolution]
    paths:
      - 'contact/lab/**'
      - 'contact/protocol/**'
      - 'contact/epochs/**'
permissions:
  contents: read
jobs:
  adversarial-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run evidence-bound negative tests
        run: python contact/lab/test_validator.py
