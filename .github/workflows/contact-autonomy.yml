name: CONTACT autonomy stepwire
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: contact-autonomy
  cancel-in-progress: false
jobs:
  stepwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contact-autonomy-threshold
      - name: Execute observation transition
        run: python contact/runtime.py
      - name: Persist state mutation
        run: |
          git config user.name 'NGL CONTACT'
          git config user.email 'contact@users.noreply.github.com'
          git add contact/state.json
          git diff --cached --quiet && exit 0
          git commit -m 'contact: persist autonomous observation'
          git push origin HEAD:contact-autonomy-threshold
